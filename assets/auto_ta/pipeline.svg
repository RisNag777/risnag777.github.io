<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="300" fill="#ffffff" />
  
  <defs>
    <marker id="pipeline-arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#718096" />
    </marker>
  </defs>

  <text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2d3748">The Data Pipeline: From PDF to Vector</text>

  <rect x="40" y="80" width="120" height="60" rx="4" fill="#edf2f7" stroke="#718096" stroke-width="2" />
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2d3748">Raw Textbook</text>

  <rect x="220" y="80" width="120" height="60" rx="4" fill="#e6fffa" stroke="#319795" stroke-width="2" />
  <text x="280" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#234e52">PyMuPDF</text>
  <text x="280" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#285e61">(Text Extraction)</text>

  <rect x="400" y="80" width="120" height="60" rx="4" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" />
  <text x="460" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7b341e">Chunking</text>
  <text x="460" y="120" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7b341e">Text + Page Num</text>
  <text x="460" y="132" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7b341e">+ Chapter</text>

  <rect x="580" y="80" width="180" height="60" rx="4" fill="#ebf8ff" stroke="#3182ce" stroke-width="2" />
  <text x="670" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c5282">Sentence Transformers</text>
  <text x="670" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c5282">(all-MiniLM-L6_v2)</text>

  <path d="M 350 210 L 450 210 L 450 270 L 350 270 Z" fill="#faf5ff" stroke="#805ad5" stroke-width="2" />
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#553c9a">Faiss Index</text>
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#553c9a">Vector Storage</text>

  <line x1="160" y1="110" x2="200" y2="110" stroke="#718096" stroke-width="2" marker-end="url(#pipeline-arrow)" />
  <line x1="340" y1="110" x2="380" y2="110" stroke="#718096" stroke-width="2" marker-end="url(#pipeline-arrow)" />
  <line x1="520" y1="110" x2="560" y2="110" stroke="#718096" stroke-width="2" marker-end="url(#pipeline-arrow)" />
  
  <path d="M 670 140 L 670 170 L 400 170 L 400 190" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#pipeline-arrow)" />
</svg>